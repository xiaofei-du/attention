name: Build Intel dependency

on:
  pull_request:
    paths:
      - .github/workflows/intel-wheel.yml
      - scripts/build_intel_wheel.py
      - scripts/verify_intel_wheel.py
      - packaging/intel-wheel-sources.json
      - packaging/intel-wheel-build-requirements.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intel-wheel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
      - name: Build the hash-pinned static dependency
        run: uv run --no-config --no-project --isolated --managed-python --python 3.12 python scripts/build_intel_wheel.py --output .build/intel-wheel
      - name: Upload reviewable dependency and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intel-wheel
          path: .build/intel-wheel/
          if-no-files-found: error
          retention-days: 14
